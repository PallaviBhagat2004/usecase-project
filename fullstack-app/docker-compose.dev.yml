services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    image: fullstack-app-backend:dev
    container_name: app-backend-dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    command: ["node", "src/server.js"]
    networks:
      - app-network

  frontend:
    image: node:20-alpine
    container_name: app-frontend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
